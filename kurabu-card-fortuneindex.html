<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玖愛♣ トランプ占い</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    text-align: center;
    background: linear-gradient(180deg, #fff 0%, #ffe6f0 100%);
    color: #333;
    padding: 20px;
  }
  h1 { color: #ff69b4; }
  #cardContainer {
    perspective: 1000px;
    display: inline-block;
    margin-top: 30px;
  }
  .card {
    width: 150px;
    height: 220px;
    background-color: white;
    border: 2px solid #333;
    border-radius: 10px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.8s;
    position: relative;
    margin: 0 auto;
  }
  .card.flipped {
    transform: rotateY(180deg);
  }
  .card .front, .card .back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
  }
  .card .front {
    background-color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 60px;
    color: #333;
  }
  .card .back {
    background-color: #ff69b4;
    transform: rotateY(180deg);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-weight: bold;
    font-size: 16px;
  }
  #result {
    margin-top: 20px;
    font-size: 18px;
    color: #ff69b4;
  }
  a {
    display: block;
    margin-top: 15px;
    color: #ff69b4;
    text-decoration: none;
  }
</style>
</head>
<body>
<h1>今日の運勢を引いてみて♣</h1>
<div id="cardContainer">
  <div class="card" id="card">
    <div class="front">🂠</div>
    <div class="back" id="cardBack">?</div>
  </div>
</div>
<div id="result"></div>
<a href="https://www.instagram.com/your_instagram_username/" target="_blank">フォローはこちら♡</a>
<button onclick="drawCard()">カードを引く</button>

<script>
const cards = [
  {suit:'♣', name:'♣7', message:'今日は笑顔いっぱい♡指名度85％！'},
  {suit:'♣', name:'♣8', message:'ラッキーDAY！指名度90％！'},
  {suit:'♣', name:'♣9', message:'めっちゃ良い日♡指名度95％！'},
  {suit:'♥', name:'♥Q', message:'ドキドキ出会いDAY♡指名度80％！'},
  {suit:'♥', name:'♥J', message:'恋のチャンスDAY♡指名度75％！'},
  {suit:'♥', name:'♥10', message:'甘〜い運勢DAY♡指名度78％！'},
  {suit:'♠', name:'♠5', message:'注意DAY💦指名度60％！'},
  {suit:'♠', name:'♠6', message:'慎重DAY💦指名度62％！'},
  {suit:'♠', name:'♠7', message:'気を付けてDAY💦指名度65％！'},
  {suit:'♦', name:'♦K', message:'ご褒美DAY✨指名度88％！'},
  {suit:'♦', name:'♦Q', message:'ラッキーDAY✨指名度85％！'},
  {suit:'♦', name:'♦J', message:'お楽しみDAY✨指名度87％！'},
  {suit:'Joker', name:'🃏Joker', message:'超ラッキーDAY♡指名度100％！'}
];

function drawCard() {
  const cardElement = document.getElementById('card');
  cardElement.classList.remove('flipped');
  const index = Math.floor(Math.random() * cards.length);
  const selected = cards[index];
  const cardBack = document.getElementById('cardBack');
  setTimeout(() => {
    cardBack.textContent = selected.name;
    document.getElementById('result').textContent = selected.message;
    cardElement.classList.add('flipped');
  }, 100);
}
</script>
</body>
</html>
